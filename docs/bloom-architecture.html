<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bloom Post-Processing Architecture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%);
      min-height: 100vh;
      padding: 40px;
      color: white;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2em;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .diagram {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 40px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .diagram h2 {
      margin-bottom: 30px;
      color: #ffd93d;
    }
    svg { width: 100%; height: auto; }
    
    /* Pipeline boxes */
    .box { 
      fill: rgba(30, 40, 60, 0.9); 
      stroke: #4d96ff; 
      stroke-width: 2; 
      rx: 10; 
    }
    .box-glow { 
      fill: rgba(40, 50, 80, 0.9); 
      stroke: #ff6b6b; 
      stroke-width: 2; 
      rx: 10; 
    }
    .box-output { 
      fill: rgba(20, 80, 40, 0.9); 
      stroke: #6bcb77; 
      stroke-width: 2; 
      rx: 10; 
    }
    .text { fill: white; font-size: 14px; font-family: 'Segoe UI', sans-serif; }
    .text-small { fill: #aaa; font-size: 11px; }
    .text-title { fill: #ffd93d; font-size: 16px; font-weight: bold; }
    .arrow { stroke: #4d96ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .arrow-glow { stroke: #ff6b6b; }
    .arrow-green { stroke: #6bcb77; }
    
    /* Visual effects simulation */
    .beam-old { fill: none; stroke: #ff4444; stroke-width: 3; }
    .beam-new { 
      fill: none; stroke: #ff4444; stroke-width: 8; 
      filter: url(#glow-red);
      opacity: 0.9;
    }
    .beam-new-glow {
      fill: none; stroke: #ff6666; stroke-width: 20; opacity: 0.3;
      filter: url(#glow-red);
    }
    .avada-old { fill: none; stroke: #00ff44; stroke-width: 3; }
    .avada-new {
      fill: none; stroke: #00ff44; stroke-width: 8;
      filter: url(#glow-green);
    }
    .avada-new-glow {
      fill: none; stroke: #44ff88; stroke-width: 25; opacity: 0.25;
      filter: url(#glow-green);
    }
    
    .before-after {
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .comparison {
      flex: 1;
      min-width: 300px;
      text-align: center;
    }
    .comparison h3 { margin: 15px 0 10px; }
    .comparison .bad { color: #ff6b6b; }
    .comparison .good { color: #6bcb77; }
    
    .stat-box {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 15px 25px;
      display: inline-block;
      margin: 10px;
    }
    .stat-box .value { font-size: 2em; font-weight: bold; color: #ffd93d; }
    .stat-box .label { font-size: 0.9em; color: #aaa; }
  </style>
</head>
<body>
  <h1>✨ Bloom Post-Processing Architecture ✨</h1>
  
  <!-- Pipeline Diagram -->
  <div class="diagram">
    <h2>📊 Render Pipeline Comparison</h2>
    <svg viewBox="0 0 900 320">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#4d96ff"/>
        </marker>
        <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
        </marker>
        <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#6bcb77"/>
        </marker>
        
        <!-- Glow filters -->
        <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      
      <!-- BEFORE label -->
      <text x="100" y="30" class="text-title bad">❌ BEFORE</text>
      
      <!-- Old pipeline -->
      <rect x="50" y="50" width="120" height="60" class="box"/>
      <text x="110" y="85" class="text" text-anchor="middle">3D Scene</text>
      
      <line x1="170" y1="80" x2="220" y2="80" class="arrow"/>
      
      <rect x="220" y="50" width="120" height="60" class="box"/>
      <text x="280" y="75" class="text" text-anchor="middle">WebGL</text>
      <text x="280" y="95" class="text" text-anchor="middle">Renderer</text>
      
      <line x1="340" y1="80" x2="390" y2="80" class="arrow"/>
      
      <rect x="390" y="50" width="120" height="60" class="box"/>
      <text x="450" y="75" class="text" text-anchor="middle">Canvas</text>
      <text x="450" y="95" class="text" text-anchor="middle">(Flat)</text>
      
      <!-- Old result -->
      <circle cx="550" cy="80" r="25" fill="#222" stroke="#444" stroke-width="2"/>
      <line x1="510" y1="80" x2="590" y2="80" class="beam-old"/>
      <text x="450" y="140" class="text-small" text-anchor="middle">Plain red beam</text>
      
      <!-- AFTER label -->
      <text x="550" y="170" class="text-title good">✅ AFTER</text>
      
      <!-- New pipeline -->
      <rect x="50" y="190" width="100" height="60" class="box"/>
      <text x="100" y="225" class="text" text-anchor="middle">3D Scene</text>
      
      <line x1="150" y1="220" x2="200" y2="220" class="arrow" style="marker-end: url(#arrowhead-red)"/>
      
      <rect x="200" y="190" width="100" height="60" class="box-glow"/>
      <text x="250" y="215" class="text" text-anchor="middle">Render</text>
      <text x="250" y="235" class="text" text-anchor="middle">Pass</text>
      
      <line x1="300" y1="220" x2="350" y2="220" class="arrow arrow-glow" style="marker-end: url(#arrowhead-red)"/>
      
      <rect x="350" y="190" width="130" height="60" class="box-glow"/>
      <text x="415" y="215" class="text" text-anchor="middle" fill="#ff6b6b">Bloom</text>
      <text x="415" y="235" class="text" text-anchor="middle" fill="#ff6b6b">Pass</text>
      
      <line x1="480" y1="220" x2="530" y2="220" class="arrow arrow-green" style="marker-end: url(#arrowhead-green)"/>
      
      <rect x="530" y="190" width="100" height="60" class="box-output"/>
      <text x="580" y="215" class="text" text-anchor="middle" fill="#6bcb77">Output</text>
      <text x="580" y="235" class="text" text-anchor="middle" fill="#6bcb77">Pass</text>
      
      <line x1="630" y1="220" x2="680" y2="220" class="arrow arrow-green" style="marker-end: url(#arrowhead-green)"/>
      
      <rect x="680" y="190" width="100" height="60" class="box-output"/>
      <text x="730" y="225" class="text" text-anchor="middle">Canvas</text>
      
      <!-- Glow effect visualization -->
      <circle cx="830" cy="220" r="30" fill="#111"/>
      <!-- Glow layers -->
      <ellipse cx="830" cy="220" rx="40" ry="8" fill="none" stroke="#ff4444" stroke-width="15" opacity="0.2"/>
      <ellipse cx="830" cy="220" rx="35" ry="6" fill="none" stroke="#ff4444" stroke-width="10" opacity="0.3"/>
      <line x1="790" y1="220" x2="870" y2="220" class="beam-new-glow"/>
      <line x1="790" y1="220" x2="870" y2="220" class="beam-new"/>
      
      <text x="830" y="280" class="text-small" text-anchor="middle" fill="#6bcb77">✨ Glowing beam ✨</text>
      
      <!-- Parameters -->
      <rect x="650" y="290" width="200" height="80" rx="10" fill="rgba(77,150,255,0.2)" stroke="#4d96ff"/>
      <text x="750" y="315" class="text-title" text-anchor="middle" fill="#4d96ff">Bloom Settings</text>
      <text x="665" y="340" class="text-small">strength: 0.8</text>
      <text x="665" y="358" class="text-small">radius: 0.4</text>
      <text x="750" y="340" class="text-small">threshold: 0.85</text>
    </svg>
  </div>
  
  <!-- Before/After Comparison -->
  <div class="diagram">
    <h2>👁️ Visual Comparison</h2>
    <div class="before-after">
      <div class="comparison">
        <h3 class="bad">Before Bloom</h3>
        <svg viewBox="0 0 200 120">
          <!-- Scene background -->
          <rect x="0" y="0" width="200" height="120" fill="#1a1a2e"/>
          <!-- Character silhouette -->
          <ellipse cx="30" cy="90" rx="20" ry="25" fill="#333"/>
          <circle cx="30" cy="55" r="12" fill="#ffcc99"/>
          <!-- Wand -->
          <line x1="45" y1="70" x2="90" y2="60" stroke="#8B4513" stroke-width="3"/>
          <!-- Plain spell beam -->
          <line x1="90" y1="60" x2="170" y2="60" stroke="#ff4444" stroke-width="3"/>
          <!-- Target -->
          <ellipse cx="170" cy="70" rx="15" ry="20" fill="#222"/>
          <circle cx="170" cy="55" r="10" fill="#e0e0e0"/>
        </svg>
        <p class="text-small">Flat, unrealistic</p>
      </div>
      
      <div class="comparison">
        <h3 class="good">After Bloom</h3>
        <svg viewBox="0 0 200 120">
          <defs>
            <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur stdDeviation="8" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="blur"/>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <!-- Scene background -->
          <rect x="0" y="0" width="200" height="120" fill="#1a1a2e"/>
          <!-- Ambient glow from spell -->
          <ellipse cx="130" cy="60" rx="60" ry="30" fill="#ff4444" opacity="0.1"/>
          <!-- Character silhouette -->
          <ellipse cx="30" cy="90" rx="20" ry="25" fill="#333"/>
          <circle cx="30" cy="55" r="12" fill="#ffcc99"/>
          <!-- Wand glow -->
          <circle cx="45" cy="65" r="8" fill="#ff6666" opacity="0.5" filter="url(#bigGlow)"/>
          <!-- Wand -->
          <line x1="45" y1="70" x2="90" y2="60" stroke="#8B4513" stroke-width="3"/>
          <!-- GLOWING spell beam -->
          <ellipse cx="130" cy="60" rx="40" ry="8" fill="#ff4444" opacity="0.2" filter="url(#bigGlow)"/>
          <line x1="90" y1="60" x2="170" y2="60" stroke="#ff4444" stroke-width="4" filter="url(#bigGlow)"/>
          <line x1="90" y1="60" x2="170" y2="60" stroke="#ffaaaa" stroke-width="2"/>
          <!-- Target glow -->
          <circle cx="170" cy="55" r="15" fill="#ff4444" opacity="0.3" filter="url(#bigGlow)"/>
          <!-- Target -->
          <ellipse cx="170" cy="70" rx="15" ry="20" fill="#222"/>
          <circle cx="170" cy="55" r="10" fill="#e0e0e0"/>
        </svg>
        <p class="text-small">Magical, alive!</p>
      </div>
    </div>
  </div>
  
  <!-- Stats -->
  <div class="diagram" style="text-align: center;">
    <h2>📈 Impact Summary</h2>
    <div class="stat-box">
      <div class="value">2.5x</div>
      <div class="label">Visual Impact</div>
    </div>
    <div class="stat-box">
      <div class="value">10%</div>
      <div class="label">FPS Cost</div>
    </div>
    <div class="stat-box">
      <div class="value">∞</div>
      <div class="label">Magic Feel</div>
    </div>
  </div>
</body>
</html>
